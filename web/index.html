<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Työmatka-alue</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root{
    --panel:#0F1A1E; --ink:#DCE7E9; --muted:#7C9298; --line:#22343A;
    --accent:#5FD3C4; --edge:#E8A33D;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--panel);color:var(--ink);overscroll-behavior:none}
  #map{position:absolute;inset:0}
  .maplibregl-ctrl-attrib{font-size:10px}

  #title{position:absolute;top:0;left:0;right:0;z-index:2;padding:10px 14px;
    background:linear-gradient(180deg,rgba(15,26,30,.92),rgba(15,26,30,0));
    pointer-events:none}
  #title h1{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em}
  #title p{margin:3px 0 0;font-size:12px;color:#B7C9CD;text-shadow:0 1px 3px rgba(0,0,0,.9)}
  #title p b{color:var(--edge)}

  #panel{position:absolute;left:0;right:0;bottom:0;z-index:3;background:var(--panel);
    border-top:1px solid var(--line);padding:0 14px calc(12px + env(safe-area-inset-bottom));
    max-height:66vh;overflow:auto;box-shadow:0 -12px 30px rgba(0,0,0,.45);
    transition:max-height .22s cubic-bezier(.3,.8,.4,1);touch-action:pan-y}
  #panel.drag{transition:none}
  #panel.min{max-height:44px;overflow:hidden}
  #grab{position:sticky;top:0;z-index:1;background:var(--panel);margin:0 -14px 8px;
    padding:9px 0 8px;cursor:grab;touch-action:none;user-select:none}
  #grab::before{content:'';display:block;width:42px;height:4px;border-radius:2px;
    background:#3A5057;margin:0 auto}
  #grab:active{cursor:grabbing}
  #panel.min #grab::before{background:var(--accent)}
  @media(min-width:760px){
    #panel{left:auto;top:0;bottom:0;width:330px;max-height:none;border-top:0;border-left:1px solid var(--line);
      padding-top:56px;max-height:none !important}
    #grab{display:none}
    #title{right:330px}
  }

  .grp{margin:0 0 12px}
  .lbl{display:flex;justify-content:space-between;align-items:baseline;
    font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .val{font-family:var(--mono);font-size:13px;color:var(--ink);letter-spacing:0}
  input[type=range]{width:100%;accent-color:var(--accent);margin:0}
  input[type=time]{font-family:var(--mono);font-size:15px;background:#16262B;color:var(--ink);
    border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
  .tw{display:flex;gap:8px;align-items:center}
  .tw span{color:var(--muted);font-family:var(--mono)}

  #legend{display:flex;gap:2px;margin:2px 0 6px}
  #legend button{flex:1;height:26px;border:0;border-radius:3px;cursor:pointer;position:relative;
    font-family:var(--mono);font-size:10px;color:#0B1417;padding:0}
  #legend button[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:1px}
  .legcap{display:flex;justify-content:space-between;font-family:var(--mono);
    font-size:10px;color:var(--muted)}

  #modes{display:flex;gap:6px}
  #modes button{flex:1;padding:8px;border-radius:6px;border:1px solid var(--line);
    background:#16262B;color:var(--muted);font-size:13px;cursor:pointer}
  #modes button[aria-pressed=true]{background:var(--accent);color:#0B1417;border-color:var(--accent);font-weight:600}

  #trip{margin:0 0 12px}
  #trip:empty{display:none}
  .thead{display:flex;justify-content:space-between;align-items:baseline;
    border-top:1px solid var(--line);padding-top:9px;margin-bottom:7px}
  .thead .t{font-family:var(--mono);font-size:19px;color:var(--edge)}
  .thead .s{font-size:11px;color:var(--muted)}
  .leg{display:flex;gap:9px;align-items:flex-start;padding:4px 0;font-size:12.5px}
  .leg .tm{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:38px;padding-top:2px}
  .leg .pill{font-family:var(--mono);font-size:12px;font-weight:700;color:#0B1417;
    background:var(--accent);border-radius:4px;padding:2px 7px;min-width:34px;text-align:center}
  .leg .pill.walk{background:transparent;color:var(--muted);border:1px dashed var(--line);font-weight:400}
  .leg .d{flex:1;line-height:1.35}
  .leg .d small{color:var(--muted)}

  #status{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.5;
    border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
  #status b{color:var(--accent);font-weight:600}
  #status .warn{color:var(--edge)}
  #isoCanvas{display:none}
</style>
</head>
<body>
<div id="map"></div>
<canvas id="isoCanvas" width="1" height="1"></canvas>

<div id="title">
  <h1>Työmatka-alue</h1>
  <p id="hint">Napauta karttaa: <b>työpaikka</b></p>
</div>

<div id="panel">
  <div id="grab" role="button" tabindex="0" aria-label="Näytä tai piilota asetukset"></div>

  <div class="grp">
    <div class="lbl"><span>Perillä välillä</span><span class="val" id="vRuns"></span></div>
    <div class="tw">
      <input type="time" id="arrFrom" value="07:30" step="300">
      <span>–</span>
      <input type="time" id="arrTo" value="08:30" step="300">
    </div>
  </div>

  <div class="grp">
    <div class="lbl"><span>Matka-aika enintään</span><span class="val" id="vMax">45 min</span></div>
    <div id="legend"></div>
    <div class="legcap"><span>nopea</span><span>ruutu 100 m</span><span>rajalla</span></div>
    <input type="range" id="maxT" min="15" max="90" step="5" value="45">
  </div>

  <div class="grp">
    <div class="lbl"><span>Kävelynopeus</span><span class="val" id="vSpd">4,5 km/h</span></div>
    <input type="range" id="spd" min="3" max="6" step="0.1" value="4.5">
  </div>

  <div class="grp">
    <div class="lbl"><span>Pisin kävely yhteen suuntaan</span><span class="val" id="vWalk">15 min</span></div>
    <input type="range" id="walk" min="5" max="30" step="1" value="15">
  </div>

  <div class="grp" id="modeRow" style="display:none">
    <div class="lbl"><span>Napautus asettaa</span></div>
    <div id="modes">
      <button id="mWork" type="button">Työpaikan</button>
      <button id="mHome" type="button" aria-pressed="true">Kodin</button>
    </div>
  </div>

  <div id="trip"></div>

  <div id="status">Ladataan aikataulutietoja…</div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module">
const $ = s => document.querySelector(s);

/* --- värit: portaittaiset 5 min kaistat, reunimmainen lämmin = "juuri ja juuri" --- */
const BANDS = ['#12414E','#1C5D6B','#2A7E88','#469E9C','#6DBBA8','#9CD4A6'];
const EDGE  = '#E8A33D';
const bandColors = n => {
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = n === 1 ? 0 : i / (n - 1);
    out.push(BANDS[Math.min(BANDS.length - 1, Math.round(t * (BANDS.length - 1)))]);
  }
  out[n - 1] = EDGE;
  return out;
};
const hex2rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];

/* --- kartta --- */
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: { osm: {
      type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
      tileSize: 256, maxzoom: 19,
      attribution: '© OpenStreetMap-tekijät · Aikataulut © HSL, CC BY 4.0'
    }},
    layers: [
      { id: 'bg', type: 'background', paint: { 'background-color': '#0F1A1E' } },
      { id: 'osm', type: 'raster', source: 'osm', paint: { 'raster-saturation': -0.85, 'raster-brightness-min': 0.12, 'raster-brightness-max': 0.62, 'raster-opacity': 0.85 } }
    ]
  },
  center: [24.94, 60.19], zoom: 9, attributionControl: { compact: true }
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

let marker = null, work = null, meta = null, ready = false, pending = false;

let mode = 'work', home = null, homeMarker = null;

map.on('click', e => {
  if (mode === 'work') setWork(e.lngLat.lat, e.lngLat.lng);
  else setHome(e.lngLat.lat, e.lngLat.lng);
});

function setMode(m) {
  mode = m;
  $('#mWork').setAttribute('aria-pressed', String(m === 'work'));
  $('#mHome').setAttribute('aria-pressed', String(m === 'home'));
  $('#hint').innerHTML = m === 'work'
    ? 'Napauta karttaa: <b>työpaikka</b>'
    : 'Napauta aluetta: <b>paras matkavaihtoehto</b>';
}
$('#mWork').onclick = () => setMode('work');
$('#mHome').onclick = () => setMode('home');

function setHome(lat, lon) {
  home = { lat, lon };
  if (!homeMarker) {
    const el = document.createElement('div');
    el.style.cssText = 'width:13px;height:13px;border-radius:3px;background:#5FD3C4;' +
      'border:2.5px solid #0F1A1E;transform:rotate(45deg)';
    homeMarker = new maplibregl.Marker({ element: el }).setLngLat([lon, lat]).addTo(map);
  } else homeMarker.setLngLat([lon, lat]);
  worker.postMessage({ type: 'itinerary', lat, lon });
}

function setWork(lat, lon) {
  work = { lat, lon };
  if (!marker) {
    const el = document.createElement('div');
    el.style.cssText = 'width:16px;height:16px;border-radius:50%;background:#E8A33D;' +
      'border:2.5px solid #0F1A1E;box-shadow:0 0 0 1.5px #E8A33D';
    marker = new maplibregl.Marker({ element: el, draggable: true }).setLngLat([lon, lat]).addTo(map);
    marker.on('dragend', () => { const p = marker.getLngLat(); work = { lat: p.lat, lon: p.lng }; solve(); });
  } else marker.setLngLat([lon, lat]);
  $('#modeRow').style.display = '';
  setMode('home');
  solve();
}

/* --- worker --- */
const worker = new Worker('./worker.js', { type: 'module' });
worker.postMessage({ type: 'load', base: './data' });

worker.onmessage = ev => {
  const m = ev.data;
  if (m.type === 'loaded') {
    meta = m.meta; ready = true;
    const d = meta.date, ds = `${d.slice(6,8)}.${d.slice(4,6)}.${d.slice(0,4)}`;
    $('#status').innerHTML =
      `aikataulut <b>${ds}</b> (${meta.weekday})<br>` +
      `${meta.nStops.toLocaleString('fi')} pysäkkiä · ${meta.nConn.toLocaleString('fi')} yhteyttä<br>` +
      (meta.hasWalk ? `kävelyrasteri ${(meta.walkCells / 1e6).toFixed(1)} M ruutua<br>`
                    : `<span class="warn">kävelyrasteri puuttuu</span><br>`) +
      `Napauta karttaa asettaaksesi työpaikan.`;
    loadWays('./data')
      .then(n => { $('#status').innerHTML += `<br>${n.toLocaleString('fi')} väylää vektorina`; updateLines(); })
      .catch(e => { $('#status').innerHTML += `<br><span class="warn">viivat: ${e.message}</span>`; });
    if (pending) solve();
  } else if (m.type === 'result') {
    if (m.empty) { $('#status').innerHTML = `<span class="warn">${m.empty}</span>`; clearIso(); return; }
    draw(m);
  } else if (m.type === 'itinerary') {
    drawTrip(m);
  } else if (m.type === 'error') {
    $('#status').innerHTML = `<span class="warn">Virhe: ${m.message}</span>`;
  }
};

/* --- piirto --- */
const cv = $('#isoCanvas');
function clearIso() {
  if (map.getLayer('iso')) map.removeLayer('iso');
  if (map.getSource('iso')) map.removeSource('iso');
}

/* ---------- vektoriviivat ---------- */
const VZ = 11.5;            // taman yli piirretaan oikeat viivat rasterin sijaan
const MAXFEAT = 14000;
let ways = null, lastRes = null;

async function loadWays(base) {
  const b = async (n, T) => {
    const r = await fetch(`${base}/${n}`);
    if (!r.ok) throw new Error(`${n}: HTTP ${r.status}`);
    return new T(await r.arrayBuffer());
  };
  const [start, ax, ay, dx, dy] = await Promise.all([
    b('way_start.bin', Uint32Array), b('way_ax.bin', Int32Array),
    b('way_ay.bin', Int32Array), b('way_dx.bin', Int16Array), b('way_dy.bin', Int16Array)
  ]);
  // vaylakohtaiset rajat nopeaa nakymarajausta varten
  const n = ax.length;
  const bx0 = new Int32Array(n), bx1 = new Int32Array(n),
        by0 = new Int32Array(n), by1 = new Int32Array(n);
  for (let k = 0; k < n; k++) {
    let x = ax[k], y = ay[k], mnx = 2e9, mny = 2e9, mxx = -2e9, mxy = -2e9;
    for (let j = start[k]; j < start[k + 1]; j++) {
      x += dx[j]; y += dy[j];
      if (x < mnx) mnx = x; if (x > mxx) mxx = x;
      if (y < mny) mny = y; if (y > mxy) mxy = y;
    }
    bx0[k] = mnx; bx1[k] = mxx; by0[k] = mny; by1[k] = mxy;
  }
  ways = { start, ax, ay, dx, dy, n, bx0, bx1, by0, by1 };
  return n;
}

function ensureLineLayers() {
  if (map.getSource('isoline')) return;
  map.addSource('isoline', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({
    id: 'isoline-case', type: 'line', source: 'isoline', minzoom: VZ,
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: {
      'line-color': '#0B1417',
      'line-opacity': 0.85,
      'line-width': ['interpolate', ['linear'], ['zoom'], 11.5, 3, 14, 7, 17, 15]
    }
  });
  map.addLayer({
    id: 'isoline', type: 'line', source: 'isoline', minzoom: VZ,
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: {
      'line-color': '#5FD3C4',
      'line-width': ['interpolate', ['linear'], ['zoom'], 11.5, 1.4, 14, 4, 17, 10]
    }
  });
}

function updateLines() {
  if (!ways || !lastRes || map.getZoom() < VZ) return;
  ensureLineLayers();

  const r = lastRes;
  const maxT = +$('#maxT').value * 60;
  const nb = Math.max(1, Math.round(maxT / 300));
  const cols = bandColors(nb);

  // nakymän rajat mercatorissa, pienellä marginaalilla
  const bb = map.getBounds();
  const pad = (lonToMercX(bb.getEast()) - lonToMercX(bb.getWest())) * 0.15;
  const vx0 = lonToMercX(bb.getWest()) - pad, vx1 = lonToMercX(bb.getEast()) + pad;
  const vy0 = latToMercY(bb.getSouth()) - pad, vy1 = latToMercY(bb.getNorth()) + pad;

  const timeAt = (x, y) => {
    const i = Math.floor((x - r.mercX0) / r.mercCell);
    const j = Math.floor((y - r.mercY0) / r.mercCell);
    if (i < 0 || i >= r.w || j < 0 || j >= r.h) return -1;
    const v = r.grid[j * r.w + i];
    return isFinite(v) && v <= maxT ? v : -1;
  };

  const feats = [];
  const W = ways;
  outer:
  for (let k = 0; k < W.n; k++) {
    if (W.bx1[k] < vx0 || W.bx0[k] > vx1 || W.by1[k] < vy0 || W.by0[k] > vy1) continue;
    let x = W.ax[k], y = W.ay[k];
    let run = null, runB = -1;
    for (let j = W.start[k]; j < W.start[k + 1]; j++) {
      x += W.dx[j]; y += W.dy[j];
      const t = timeAt(x, y);
      const b = t < 0 ? -1 : Math.min(nb - 1, Math.floor(t / maxT * nb));
      const ll = [mercXToLon(x), mercYToLat(y)];
      if (b < 0) {
        if (run && run.length > 1) feats.push({ type: 'Feature', properties: { b: runB }, geometry: { type: 'LineString', coordinates: run } });
        run = null; runB = -1;
        continue;
      }
      if (!run) { run = [ll]; runB = b; continue; }
      if (b !== runB) {
        run.push(ll);
        if (run.length > 1) feats.push({ type: 'Feature', properties: { b: runB }, geometry: { type: 'LineString', coordinates: run } });
        if (feats.length >= MAXFEAT) break outer;
        run = [ll]; runB = b;
        continue;
      }
      run.push(ll);
    }
    if (run && run.length > 1) feats.push({ type: 'Feature', properties: { b: runB }, geometry: { type: 'LineString', coordinates: run } });
    if (feats.length >= MAXFEAT) break;
  }

  const match = ['match', ['get', 'b']];
  for (let i = 0; i < nb; i++) match.push(i, cols[i]);
  match.push(cols[nb - 1]);
  map.setPaintProperty('isoline', 'line-color', match);
  map.getSource('isoline').setData({ type: 'FeatureCollection', features: feats });
}

const R_E = 6378137;
const lonToMercX = lon => R_E * lon * Math.PI / 180;
const latToMercY = lat => R_E * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
const mercXToLon = x => x / R_E * 180 / Math.PI;
const mercYToLat = y => (2 * Math.atan(Math.exp(y / R_E)) - Math.PI / 2) * 180 / Math.PI;

let lt = null;
map.on('moveend', () => { clearTimeout(lt); lt = setTimeout(updateLines, 60); });

function draw(r) {
  if (!map.isStyleLoaded()) { map.once('idle', () => draw(r)); return; }
  const maxT = +$('#maxT').value * 60;
  const nb = Math.max(1, Math.round(maxT / 300));
  const cols = bandColors(nb).map(hex2rgb);

  cv.width = r.w; cv.height = r.h;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(r.w, r.h);
  const px = img.data;

  for (let j = 0; j < r.h; j++) {
    // ruudukon rivi 0 = etelä, kuvan rivi 0 = pohjoinen
    const src = (r.h - 1 - j) * r.w, dst = j * r.w;
    for (let i = 0; i < r.w; i++) {
      const o = (dst + i) * 4;
      if (!r.road[src + i]) { px[o+3] = 0; continue; }   // vain varsinaiset tiet
      const v = r.grid[src + i];
      if (!isFinite(v) || v > maxT) { px[o+3] = 0; continue; }
      const b = Math.min(nb - 1, Math.floor(v / maxT * nb));
      const c = cols[b];
      px[o] = c[0]; px[o+1] = c[1]; px[o+2] = c[2]; px[o+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  lastRes = r;

  const [W, N, E, S] = r.bounds;
  clearIso();
  map.addSource('iso', {
    type: 'canvas', canvas: 'isoCanvas', animate: false,
    coordinates: [[W, N], [E, N], [E, S], [W, S]]
  });
  map.addLayer({ id: 'iso', type: 'raster', source: 'iso', maxzoom: VZ,
    paint: { 'raster-opacity': 1, 'raster-resampling': 'nearest', 'raster-fade-duration': 0 } });

  $('#status').innerHTML =
    `<b>${r.reachableStops.toLocaleString('fi')}</b> pysäkkiä · <b>${r.km2}</b> km² tavoitettavissa<br>` +
    `<b>${r.runs}</b> saapumisaikaa · laskenta <b>${r.ms} ms</b><br>` +
    `kävely katuverkkoa pitkin`;
  updateLines();
}

const hhmm = t => `${String(Math.floor(t / 3600) % 24).padStart(2, '0')}.${String(Math.floor(t / 60) % 60).padStart(2, '0')}`;

function drawTrip(m) {
  const el = $('#trip');
  if (m.empty) { el.innerHTML = `<div class="thead"><span class="s warn">${m.empty}</span></div>`; return; }

  let h = `<div class="thead"><span class="t">${Math.round(m.total / 60)} min</span>` +
          `<span class="s">lähtö ${hhmm(m.leave)} · perillä ${hhmm(m.arriveBy)}</span></div>`;

  h += `<div class="leg"><span class="tm">${hhmm(m.leave)}</span>` +
       `<span class="pill walk">${Math.round(m.firstWalk / 60)}′</span>` +
       `<span class="d">Kävele pysäkille <small>${m.firstStop}</small></span></div>`;

  for (const L of m.legs) {
    if (L.mode === 'walk') {
      h += `<div class="leg"><span class="tm">${hhmm(L.dep)}</span>` +
           `<span class="pill walk">${Math.max(1, Math.round(L.sec / 60))}′</span>` +
           `<span class="d">${L.last ? 'Kävele työpaikalle' : 'Vaihto'} ` +
           `<small>${L.last ? 'perillä ' + hhmm(L.arr) : L.toName}</small></span></div>`;
    } else {
      h += `<div class="leg"><span class="tm">${hhmm(L.dep)}</span>` +
           `<span class="pill">${L.line}</span>` +
           `<span class="d">${L.kind}${L.head ? ' → ' + L.head : ''}<br>` +
           `<small>${L.fromName} → ${L.toName}, ${hhmm(L.arr)}</small></span></div>`;
    }
  }
  el.innerHTML = h;
}

/* --- ohjaimet --- */
function solve() {
  if (!work) return;
  if (!ready) { pending = true; return; }
  const secs = v => { const [h, m] = v.split(':').map(Number); return h * 3600 + m * 60; };
  let a0 = secs($('#arrFrom').value), a1 = secs($('#arrTo').value);
  if (a1 < a0) [a0, a1] = [a1, a0];
  const step = 300;
  worker.postMessage({
    type: 'solve',
    lat: work.lat, lon: work.lon,
    arriveFrom: a0, arriveTo: a1, step,
    maxTravel: +$('#maxT').value * 60,
    walkMps: +$('#spd').value / 3.6,
    maxWalkSec: +$('#walk').value * 60,
    minTransfer: 120
  });
}

function legend() {
  const maxT = +$('#maxT').value;
  const nb = Math.max(1, Math.round(maxT / 5));
  const cols = bandColors(nb);
  const el = $('#legend');
  el.innerHTML = '';
  // näytetään enintään 9 nappia, muuten liian tiheä kännykällä
  const step = Math.ceil(nb / 9);
  for (let i = step - 1; i < nb; i += step) {
    const mins = Math.round((i + 1) / nb * maxT);
    const b = document.createElement('button');
    b.style.background = cols[i];
    b.textContent = mins;
    b.title = `${mins} min`;
    b.setAttribute('aria-pressed', String(mins === maxT));
    b.onclick = () => { $('#maxT').value = mins; sync(); solve(); };
    el.appendChild(b);
  }
}

function sync() {
  const secs = v => { const [h, m] = v.split(':').map(Number); return h * 3600 + m * 60; };
  const n = Math.max(1, Math.floor(Math.abs(secs($('#arrTo').value) - secs($('#arrFrom').value)) / 300) + 1);
  $('#vRuns').textContent = `${n} lähtöä`;
  $('#vMax').textContent = $('#maxT').value + ' min';
  $('#vSpd').textContent = (+$('#spd').value).toFixed(1).replace('.', ',') + ' km/h';
  $('#vWalk').textContent = $('#walk').value + ' min';
  legend();
}

/* --- paneelin kahva --- */
(() => {
  const panel = $('#panel'), grab = $('#grab');
  const MIN = 44;
  let y0 = 0, base = 0, dragging = false, moved = 0;
  // Paneeli kutistuu KORKEUDESTA, ei siirry alaspäin -> kahva ei voi valua
  // selaimen osoitepalkin alle.
  const full = () => Math.min(panel.scrollHeight, innerHeight * 0.66);
  const setH = v => { panel.style.maxHeight = Math.round(Math.min(full(), Math.max(MIN, v))) + 'px'; };
  const cur = () => panel.getBoundingClientRect().height;
  const open = () => { panel.classList.remove('min'); panel.style.maxHeight = ''; };
  const shut = () => { panel.classList.add('min'); panel.style.maxHeight = ''; };
  const toggle = () => panel.classList.contains('min') ? open() : shut();

  grab.addEventListener('pointerdown', e => {
    if (innerWidth >= 760) return;
    dragging = true; moved = 0; y0 = e.clientY; base = cur();
    panel.classList.add('drag'); panel.classList.remove('min');
    grab.setPointerCapture(e.pointerId);
  });
  grab.addEventListener('pointermove', e => {
    if (!dragging) return;
    const d = e.clientY - y0;
    moved = Math.max(moved, Math.abs(d));
    setH(base - d);
  });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    panel.classList.remove('drag');
    panel.style.maxHeight = '';
    if (moved < 6) { toggle(); return; }
    if (cur() < full() * 0.5) shut(); else open();
  };
  grab.addEventListener('pointerup', end);
  grab.addEventListener('pointercancel', end);
  grab.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
  });
})();

let t = null;
const debounce = () => { clearTimeout(t); t = setTimeout(solve, 180); };
for (const id of ['#maxT', '#spd', '#walk']) {
  $(id).addEventListener('input', () => { sync(); debounce(); });
}
for (const id of ['#arrFrom', '#arrTo']) $(id).addEventListener('change', () => { sync(); solve(); });
sync();
</script>
</body>
